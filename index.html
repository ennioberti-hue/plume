<style>
:root{--bg:#FBF9F4;--card:#FFFDF9;--ink:#2a2622;--soft:#6b635a;--line:#d8d1c4;--accent:#8C4A3D;--accent-ink:#fff;--gold:#B07A1E;--ok:#2E6B63;--bad:#a23a2f;--shadow:0 1px 2px rgba(42,38,34,.08),0 4px 14px rgba(42,38,34,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1c19;--card:#2a2622;--ink:#ece6dc;--soft:#a79d90;--line:#3d3832;--accent:#d08a78;--accent-ink:#1f1c19;--gold:#e0b25a;--ok:#6fb7aa;--bad:#e08a7e;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1c19;--card:#2a2622;--ink:#ece6dc;--soft:#a79d90;--line:#3d3832;--accent:#d08a78;--accent-ink:#1f1c19;--gold:#e0b25a;--ok:#6fb7aa;--bad:#e08a7e;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* accesso */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow)}
.lcard h1{font-size:34px;letter-spacing:.2px}
.lcard p{color:var(--soft);margin:6px 0 18px}
.lcard label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.lcard input[type=email],.lcard input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
.lcard .rem{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:13.5px;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lcard .btn{width:100%;margin-top:18px}
.msg{min-height:20px;margin-top:12px;font-weight:600;font-size:13.5px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

/* barra */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.hb{position:relative;display:flex;align-items:center;gap:12px;height:54px}
.logo{font:600 24px 'Fraunces',Georgia,serif}
.cur{margin-right:auto;color:var(--soft);font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur::before{content:"·";margin-right:10px;color:var(--line)}
#menu{position:absolute;top:calc(100% + 4px);right:0;z-index:30;min-width:210px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 12px 32px rgba(0,0,0,.18);padding:6px}
#menu[hidden]{display:none}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab,.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 14px;border-radius:10px;color:var(--ink);font:inherit;font-weight:600;text-align:left}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.mi svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi.spin svg{animation:sp 1s linear infinite}
.msep{height:1px;background:var(--line);margin:6px 8px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#status{font-size:12.5px;color:var(--soft);padding:6px 0 0}

/* filtri */
.filters{display:flex;flex-direction:column;gap:12px;padding:14px 0 6px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
select{padding:10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mem{display:flex;gap:10px;overflow-x:auto;padding:10px 8px 8px;margin:-4px -8px 0;scrollbar-width:thin}
.m{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;width:62px;color:var(--soft)}
.mav{width:46px;height:46px;border-radius:50%;border:2px solid transparent;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:600;font-size:15px;color:var(--ink)}
.mav img{width:100%;height:100%;object-fit:cover;display:block}
.m.on .mav{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.m.on{color:var(--ink)}
.mn{font-size:11.5px;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:var(--soft);font-size:13px;padding:2px 0 10px}
@media (max-width:699px){
  .logo{margin-right:auto}
  header .cur{display:none}
}

/* collezione */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:40px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;box-shadow:var(--shadow)}
.cv{aspect-ratio:1;background:var(--line);display:block;width:100%;object-fit:cover}
.cb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ca{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{color:var(--soft);font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.mas{display:inline-block;background:var(--gold);color:var(--bg);font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;letter-spacing:.3px;width:max-content}
.empty{color:var(--soft);padding:40px 0;text-align:center}

/* scheda disco */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(20,17,15,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0));position:relative}
@media (min-width:700px){#sheet{align-items:center}.panel{border-radius:18px;max-height:88vh}}
.dh{display:flex;gap:16px;align-items:flex-start}
.dh img{width:132px;height:132px;border-radius:10px;object-fit:cover;box-shadow:var(--shadow);flex:0 0 auto;background:var(--line)}
.dh h2{font-size:22px;line-height:1.2;margin-bottom:8px}
.dh .by{color:var(--soft);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--soft)}
.dsec{margin-top:18px}
.dsec h3{font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-family:'Work Sans',system-ui,sans-serif;font-weight:600}
.dsec p{margin:0 0 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--soft)}

/* scorrimento tra i dischi */
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 12px}
.pos{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}
.pbtns{display:flex;gap:8px}
.ib[disabled]{opacity:.35;cursor:default}
.pc{will-change:transform,opacity}
.pc.in-next{animation:inr .22s ease-out}
.pc.in-prev{animation:inl .22s ease-out}
@keyframes inr{from{transform:translateX(44px);opacity:0}to{transform:none;opacity:1}}
@keyframes inl{from{transform:translateX(-44px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pc.in-next,.pc.in-prev{animation:none}}
.panel,#sheet{touch-action:pan-y}

/* profilo */
.pf{padding:14px 0 50px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:center;gap:14px}
.ph .mav{width:64px;height:64px;font-size:22px}
.ph h2{font-size:24px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.num{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.num b{font:600 26px 'Fraunces',Georgia,serif}
.num span{color:var(--soft);font-size:12.5px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec h2{font-size:17px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr 34px;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.bar .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar b{text-align:right;font-weight:600}
.h{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.h:first-of-type{border-top:0}
.th{width:42px;height:42px;border-radius:6px;background:var(--line);overflow:hidden;flex:0 0 auto}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ht{flex:1;min-width:0;display:flex;flex-direction:column}
.ht b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ht span{color:var(--soft);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.h time{color:var(--soft);font-size:12.5px;white-space:nowrap}
.hint{color:var(--soft);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.wx{flex:none;min-width:36px;height:34px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--soft);font-size:15px}
.wx.sure{background:var(--bad);color:var(--accent-ink);font-size:13px;font-weight:600}
.wform{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wform input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.wform .row{margin-top:2px}
.link{border:0;background:transparent;color:var(--accent);padding:6px 0;font-weight:600}

#boot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:10px;color:var(--soft)}
.dots{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite}

/* aggiungi un disco */
#add{position:fixed;inset:0;z-index:60;background:rgba(20,17,15,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){#add{align-items:center}}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:46vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.3);pointer-events:none}
.alab{display:block;font-weight:600;font-size:13px;color:var(--soft);margin:2px 0 0}
.asep{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:12.5px;margin:16px 0 2px}
.asep::before,.asep::after{content:"";flex:1;height:1px;background:var(--line)}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.res{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;color:var(--ink)}
.res .th{width:56px;height:56px;border-radius:8px}
.res .ht b{white-space:normal;line-height:1.25}
.res .ht span{white-space:normal}
.acov{width:132px;height:132px;border-radius:10px;background:var(--line);flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--soft);font-size:12.5px;padding:6px;box-shadow:var(--shadow)}
.acov img{width:100%;height:100%;object-fit:cover;display:block}
.wform select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.wform input{margin-bottom:0}
.afields{display:flex;flex-direction:column;gap:6px;margin-top:14px}
@media (max-width:420px){.acov{width:104px;height:104px}}
.aload{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:30vh;gap:10px;color:var(--soft)}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="lcard" id="lform" autocomplete="on">
    <h1>Plume</h1>
    <p>La tua collezione, ovunque. Accedi con l'utente creato su Firebase.</p>
    <label for="em">Email</label>
    <input id="em" name="email" type="email" autocomplete="username" inputmode="email" required>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Resta collegato su questo dispositivo</label>
    <button class="btn primary" type="submit" id="lgo">Accedi</button>
    <div class="msg" id="lmsg" role="status"></div>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="hb">
        <div class="logo">Plume</div>
        <div class="cur" id="cur">Collezione</div>
        <button class="ib" id="addbtn" type="button" aria-label="Aggiungi un disco" title="Aggiungi un disco"><svg viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h2M18 4h2a1 1 0 0 1 1 1v2M21 17v2a1 1 0 0 1-1 1h-2M6 20H4a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M16.5 8v8"/></svg></button>
        <button class="ib" id="menubtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div id="menu" role="menu" hidden>
          <nav class="tabs" aria-label="Sezioni">
            <button class="tab on" role="menuitem" data-tab="coll">Collezione</button>
            <button class="tab" role="menuitem" data-tab="prof">Profilo</button>
          </nav>
          <div class="msep"></div>
          <button class="mi" id="refresh" role="menuitem"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span>Aggiorna</span></button>
          <button class="mi" id="logout" role="menuitem"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Esci</span></button>
        </div>
      </div>
      <div id="status"></div>
    </div>
  </header>

  <main class="wrap">
    <div id="boot"><div class="dots"></div><div id="bootmsg">Carico la collezione…</div></div>

    <section id="v-coll" hidden>
      <div class="filters">
        <div class="mem" id="c-mem"></div>
        <div class="frow">
          <input id="q" type="search" placeholder="Cerca artista, titolo, etichetta…" autocomplete="off">
          <select id="min" aria-label="Voto minimo">
            <option value="0">Ogni voto</option>
            <option value="3">★★★ e più</option>
            <option value="4">★★★★ e più</option>
            <option value="5">★★★★★ e più</option>
            <option value="6">Solo capolavori</option>
          </select>
          <select id="sort" aria-label="Ordina">
            <option value="artist">Artista A–Z</option>
            <option value="title">Titolo A–Z</option>
            <option value="rating">Voto più alto</option>
            <option value="recent">Aggiunti di recente</option>
          </select>
        </div>
        <div class="chips" id="c-media"></div>
      </div>
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="none" hidden>Nessun disco corrisponde ai filtri.</div>
    </section>

    <section id="v-prof" hidden>
      <div class="filters"><div class="mem" id="p-mem"></div></div>
      <div class="pf" id="pf"></div>
    </section>

  </main>
</div>

<div id="add" hidden><div class="panel" id="addp" role="dialog" aria-modal="true" aria-label="Aggiungi un disco"></div></div>
<input type="file" id="a-file" accept="image/*" hidden>
<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
// Le chiavi del progetto Firebase sono pubbliche per progetto: i dati sono protetti dalle regole di Firestore.
var CFG = { apiKey: 'AIzaSyClPxh-Eb9agTkoN1CM1kBdv8hOUW_iyCQ', project: 'plume-ennio' };
var AUTH = 'https://identitytoolkit.googleapis.com', TOK = 'https://securetoken.googleapis.com';
var FSB = 'https://firestore.googleapis.com/v1/projects/' + CFG.project + '/databases/(default)/documents';
var Q = new URLSearchParams(location.search);       // solo per prove: ?mock=http://host:porta
if (Q.get('mock') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { AUTH = TOK = Q.get('mock'); FSB = Q.get('mock') + '/v1/projects/' + CFG.project + '/databases/(default)/documents'; }

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

// ---------- valori Firestore ----------
function fromFs(x) {
  if (!x) return null;
  if ('stringValue' in x) return x.stringValue;
  if ('integerValue' in x) return Number(x.integerValue);
  if ('doubleValue' in x) return x.doubleValue;
  if ('booleanValue' in x) return x.booleanValue;
  if ('arrayValue' in x) return (x.arrayValue.values || []).map(fromFs);
  if ('mapValue' in x) return fromFields(x.mapValue.fields || {});
  return null;
}
function fromFields(f) { var o = {}; Object.keys(f || {}).forEach(function (k) { o[k] = fromFs(f[k]); }); return o; }

// ---------- accesso ----------
var idTok = '', idExp = 0, session = { email: '' };
function CErr(code, status, msg) { var e = new Error(msg || code); e.code = code; e.status = status || 0; return e; }
async function http(method, url, body, headers) {
  var r;
  try { r = await fetch(url, { method: method, headers: headers || {}, body: body }); }
  catch (e) { throw CErr('offline', 0, 'Nessuna connessione'); }
  var t = await r.text(), j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) {
    var m = (j && j.error && (j.error.message || j.error.status)) || ('HTTP ' + r.status), c = 'api_error';
    if (/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|USER_DISABLED/.test(m)) c = 'bad_credentials';
    else if (/TOO_MANY_ATTEMPTS/.test(m)) c = 'too_many';
    else if (/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|CREDENTIAL_TOO_OLD/.test(m) || r.status === 401) c = 'relogin';
    else if (r.status === 403 || /PERMISSION_DENIED/.test(m)) c = 'permission';
    else if (r.status === 429 || /RESOURCE_EXHAUSTED/.test(m)) c = 'quota';
    var ce = CErr(c, r.status, m); ce.fsStatus = (j && j.error && j.error.status) || ''; throw ce;
  }
  return j;
}
var ERR = { bad_credentials: 'Email o password non corretti.', too_many: 'Troppi tentativi: riprova tra qualche minuto.', offline: 'Nessuna connessione a Internet.', permission: 'Accesso negato dalle regole del database.', quota: 'Limite giornaliero del piano gratuito raggiunto: riprova domani.', relogin: 'Accesso scaduto: accedi di nuovo.', api_error: 'Errore del servizio, riprova.', conflict: 'La wishlist è stata modificata in contemporanea: riprova.', no_profile: 'Il profilo non è ancora nel cloud: sincronizza prima dal PC.', bad_profile: 'Non riesco a leggere il profilo salvato nel cloud.' };
async function signIn(email, pw, remember) {
  var j = await http('POST', AUTH + '/v1/accounts:signInWithPassword?key=' + encodeURIComponent(CFG.apiKey), JSON.stringify({ email: email, password: pw, returnSecureToken: true }), { 'Content-Type': 'application/json' });
  idTok = j.idToken; idExp = Date.now() + (Number(j.expiresIn) || 3600) * 1000; session.email = email;
  lsSet('plume.rt', remember ? j.refreshToken : ''); lsSet('plume.email', email);
  return j;
}
async function token() {
  if (idTok && Date.now() < idExp - 60000) return idTok;
  var rt = lsGet('plume.rt'); if (!rt) throw CErr('relogin', 401);
  var j = await http('POST', TOK + '/v1/token?key=' + encodeURIComponent(CFG.apiKey), 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt), { 'Content-Type': 'application/x-www-form-urlencoded' });
  idTok = j.id_token; idExp = Date.now() + (Number(j.expires_in) || 3600) * 1000;
  if (j.refresh_token) lsSet('plume.rt', j.refresh_token);
  return idTok;
}
async function fs(method, rel, body) {
  var t = await token();
  var h = { Authorization: 'Bearer ' + t }; if (body) h['Content-Type'] = 'application/json';
  return http(method, FSB + rel, body ? JSON.stringify(body) : undefined, h);
}
function docId(name) { return decodeURIComponent(name.split('/').pop()); }
async function listMeta(coll) {
  var out = {}, pt = '';
  do {
    var j = await fs('GET', '/' + coll + '?pageSize=300&mask.fieldPaths=u&mask.fieldPaths=h&mask.fieldPaths=del' + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''));
    ((j && j.documents) || []).forEach(function (d) { var f = fromFields(d.fields || {}); out[docId(d.name)] = { u: Number(f.u) || 0, del: !!f.del }; });
    pt = (j && j.nextPageToken) || '';
  } while (pt);
  return out;
}
async function batchGet(coll, ids, onProgress) {
  var out = {};
  for (var i = 0; i < ids.length; i += 25) {
    var part = ids.slice(i, i + 25);
    var j = await fs('POST', ':batchGet', { documents: part.map(function (id) { return 'projects/' + CFG.project + '/databases/(default)/documents/' + coll + '/' + id; }) });
    (j || []).forEach(function (e) { if (e.found) out[docId(e.found.name)] = fromFields(e.found.fields || {}); });
    if (onProgress) onProgress(Math.min(i + 25, ids.length), ids.length);
  }
  return out;
}

// ---------- scrittura della wishlist (legge il profilo, modifica solo la wishlist, riscrive con controllo di concorrenza) ----------
async function writeWishlist(mutate) {
  for (var attempt = 0; attempt < 3; attempt++) {
    var j = await fs('GET', '/meta/profile').catch(function (e) { if (e.status === 404) return null; throw e; });
    if (!j || !j.fields) throw CErr('no_profile', 404);
    var pf = fromFields(j.fields), p = {};
    try { p = JSON.parse(pf.d || '{}'); } catch (e) { throw CErr('bad_profile', 0); }
    if (!p || typeof p !== 'object') throw CErr('bad_profile', 0);
    if (!Array.isArray(p.wishlist)) p.wishlist = [];
    if (mutate(p.wishlist, p) === 'skip') return { skipped: true, wishlist: p.wishlist, u: Number(pf.u) || 0 };
    var now = Math.max(Date.now(), (Number(pf.u) || 0) + 1);
    try {
      await fs('PATCH', '/meta/profile?updateMask.fieldPaths=u&updateMask.fieldPaths=d&currentDocument.updateTime=' + encodeURIComponent(j.updateTime || ''),
        { fields: { u: { integerValue: String(now) }, d: { stringValue: JSON.stringify(p) } } });
    } catch (e) {
      if (e.status === 409 || e.status === 412 || (e.status === 400 && /FAILED_PRECONDITION|ABORTED/.test((e.fsStatus || '') + ' ' + e.message))) continue;
      throw e;
    }
    return { wishlist: p.wishlist, u: now };
  }
  throw CErr('conflict', 409);
}
function normW(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }

// ---------- copia locale (IndexedDB) ----------
var idb = null;
function idbOpen() {
  return new Promise(function (res) {
    if (idb) return res(idb);
    try {
      var r = indexedDB.open('plume-web', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('discs', { keyPath: 'id' }); };
      r.onsuccess = function () { idb = r.result; res(idb); };
      r.onerror = function () { res(null); };
    } catch (e) { res(null); }
  });
}
function idbAll() { return new Promise(function (res) { if (!idb) return res([]); try { var q = idb.transaction('discs').objectStore('discs').getAll(); q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { res([]); }; } catch (e) { res([]); } }); }
function idbWrite(put, del) { return new Promise(function (res) { if (!idb) return res(); try { var tx = idb.transaction('discs', 'readwrite'), s = tx.objectStore('discs'); put.forEach(function (x) { s.put(x); }); del.forEach(function (id) { s.delete(id); }); tx.oncomplete = tx.onerror = tx.onabort = function () { res(); }; } catch (e) { res(); } }); }
function idbClear() { return new Promise(function (res) { if (!idb) return res(); try { var tx = idb.transaction('discs', 'readwrite'); tx.objectStore('discs').clear(); tx.oncomplete = tx.onerror = function () { res(); }; } catch (e) { res(); } }); }

// ---------- dati ----------
var D = { discs: [], cache: {}, members: [], wishlist: [], history: null, histU: 0, loadedAt: 0 };
var V = { tab: 'coll', owner: 'all', media: 'all', q: '', min: 0, sort: 'artist', pOwner: 'all', wAdd: false, wDel: '', wMsg: null, wBusy: false };

function ownerOf(r) { var m = D.members; if (!m.length) return ''; if (r.owner && m.some(function (x) { return x.id === r.owner; })) return r.owner; return m[0].id; }
// una voce senza membro (o con un membro che non esiste piu) appartiene al profilo principale, come nell'app
function wishOf(id) {
  var main = D.members.length ? D.members[0].id : '';
  return D.wishlist.filter(function (w) { return (w.member && D.members.some(function (m) { return m.id === w.member; }) ? w.member : main) === id; }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
}
function mediaOf(r) { return Array.isArray(r.media) ? r.media : (r.media ? [r.media] : ['cd']); }
function setStatus(t) { $('status').textContent = t || ''; }

async function loadAll(manual) {
  var btn = $('refresh'); btn.classList.add('spin');
  try {
    await idbOpen();
    if (!D.discs.length) {
      var cached = await idbAll();
      cached.forEach(function (x) { D.cache[x.id] = x; });
      if (cached.length) { rebuild(); showMain(); }
    }
    setStatus('Controllo gli aggiornamenti…');
    var meta = await listMeta('discs');
    var live = Object.keys(meta).filter(function (id) { return !meta[id].del; });
    var need = live.filter(function (id) { return !D.cache[id] || D.cache[id].u !== meta[id].u; });
    var gone = Object.keys(D.cache).filter(function (id) { return !meta[id] || meta[id].del; });
    if (need.length) {
      if (!$('boot').hidden) $('bootmsg').textContent = 'Scarico ' + need.length + ' dischi…';
      var docs = await batchGet('discs', need, function (n, t) { setStatus('Scarico i dischi: ' + n + ' di ' + t); if (!$('boot').hidden) $('bootmsg').textContent = 'Scarico i dischi: ' + n + ' di ' + t; });
      var put = [];
      need.forEach(function (id) { var f = docs[id]; if (!f) return; var u = Number(f.u) || 0; delete f.u; delete f.h; delete f.del; f.id = id; var e = { id: id, u: u, rec: f }; D.cache[id] = e; put.push(e); });
      await idbWrite(put, gone);
    } else if (gone.length) await idbWrite([], gone);
    gone.forEach(function (id) { delete D.cache[id]; });
    rebuild(); showMain();
    // profilo
    var pj = await fs('GET', '/meta/profile').catch(function (e) { if (e.status === 404) return null; throw e; });
    if (pj && pj.fields) {
      var pf = fromFields(pj.fields), p = {};
      try { p = JSON.parse(pf.d || '{}'); } catch (e) {}
      D.members = Array.isArray(p.members) ? p.members : []; D.wishlist = Array.isArray(p.wishlist) ? p.wishlist : [];
      if (D.histU !== pf.u) { D.history = null; D.histU = pf.u; D.nh = pf.nh || 0; }
    }
    D.loadedAt = Date.now();
    rebuild(); showMain(); renderAll();
    setStatus(D.discs.length + ' dischi · aggiornato alle ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    if (e.code === 'relogin') { toLogin(ERR.relogin); return; }
    var msg = ERR[e.code] || ERR.api_error;
    if (D.discs.length) setStatus(msg + ' Mostro l\'ultima copia salvata.'); else { $('bootmsg').textContent = msg; $('boot').querySelector('.dots').hidden = true; }
  } finally { btn.classList.remove('spin'); }
}
function rebuild() {
  D.discs = Object.keys(D.cache).map(function (id) { return D.cache[id].rec; });
}
async function loadHistory() {
  if (D.history) return D.history;
  var ids = []; for (var i = 0; i < (D.nh || 0); i++) ids.push('c' + String(i).padStart(3, '0'));
  var docs = ids.length ? await batchGet('hist', ids) : {}, all = [];
  ids.forEach(function (id) { try { all = all.concat(JSON.parse((docs[id] || {}).d || '[]')); } catch (e) {} });
  D.history = all; return all;
}

// ---------- interfaccia ----------
function showMain() { $('login').hidden = true; $('app').hidden = false; $('boot').hidden = true; show(V.tab); }
function toLogin(msg) {
  $('app').hidden = true; $('login').hidden = false; $('lmsg').className = 'msg bad'; $('lmsg').textContent = msg || '';
  $('em').value = lsGet('plume.email'); $('pw').value = ''; $('lgo').disabled = false;
}
function show(tab) {
  V.tab = tab; V.wMsg = null; V.wDel = '';
  var curEl = $('cur'); if (curEl) curEl.textContent = { coll: 'Collezione', prof: 'Profilo' }[tab] || '';
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  var booting = !$('boot').hidden;
  $('v-coll').hidden = booting || tab !== 'coll';
  $('v-prof').hidden = booting || tab !== 'prof';
  renderAll(); window.scrollTo(0, 0);
}
function avatar(m) { return m.photo ? '<img src="' + esc(m.photo) + '" alt="">' : esc((m.name || '?').trim().charAt(0).toUpperCase()); }
function memberStrip(el, cur) {
  if (!D.members.length) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '<button class="m' + (cur === 'all' ? ' on' : '') + '" data-m="all" title="Tutti"><span class="mav">ALL</span><span class="mn">Tutti</span></button>' +
    D.members.map(function (m) { return '<button class="m' + (cur === m.id ? ' on' : '') + '" data-m="' + esc(m.id) + '" title="' + esc(m.name) + '"><span class="mav">' + avatar(m) + '</span><span class="mn">' + esc(m.name) + '</span></button>'; }).join('');
}
function stars(n) {
  if (!n) return '';
  if (n >= 6) return '<span class="mas">★ Capolavoro</span>';
  var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<i>★</i>';
  return '<span class="stars" aria-label="' + n + ' stelle">' + s + '</span>';
}
function renderAll() { if (V.tab === 'coll') renderColl(); else renderProf(); }

function renderColl() {

function summary(sel) {

  D.discs.forEach(function (r) {
    if (sel !== 'all' && ownerOf(r) !== sel) return;
    total++;
    var mm = mediaOf(r); if (mm.indexOf('vinile') > -1) vn++; if (mm.indexOf('dvd') > -1) dv++; if (mm.indexOf('cd') > -1 || !mm.length) cd++;
    var a = String(r.artist || '').trim().toLowerCase(); if (a) artists[a] = (artists[a] || { n: 0, name: r.artist }), artists[a].n++;
    var g = String(r.genre || '').trim(); if (g) { var k = g.toLowerCase(); genres[k] = genres[k] || { n: 0, name: g }; genres[k].n++; }
    var rt = r.rating || 0; if (rt === 6) ms++; if (rt > 0) { rated++; sum += rt; }
  });
  var ak = Object.keys(artists), top = null; ak.forEach(function (k) { if (!top || artists[k].n > top.n) top = artists[k]; });
  var gl = Object.keys(genres).map(function (k) { return genres[k]; }).sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name, 'it'); }).slice(0, 6);

  var diff = Math.round((day(now) - day(d)) / 86400000);

function toFs(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFs) } };
  return { mapValue: { fields: toFields(v) } };
}
function toFields(o) { var f = {}; Object.keys(o).forEach(function (k) { if (o[k] !== undefined) f[k] = toFs(o[k]); }); return f; }

function stable(v) {
  if (v === undefined) return 'null';
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  return JSON.stringify(v);
}

  } catch (e) { return ''; }
}

  try { r = await fetch(MBB + path); } catch (e) { throw CErr('offline', 0, 'Nessuna connessione'); }
  if (r.status === 503 || r.status === 429) throw CErr('mb_busy', r.status);
  if (!r.ok) throw CErr('mb_error', r.status);

}
function acName(ac) { return (ac || []).map(function (x) { return (x.name || (x.artist && x.artist.name) || '') + (x.joinphrase || ''); }).join('').trim(); }

  var out = [];
  (media || []).forEach(function (m) {
    var f = String(m.format || ''), k = /vinyl|vinile/i.test(f) ? 'vinile' : (/dvd/i.test(f) ? 'dvd' : (/digital|file/i.test(f) ? '' : 'cd'));
    if (k && out.indexOf(k) < 0) out.push(k);
  });
  return out.length ? out : ['cd'];
}

}
function dedupRel(list) {
  var seen = {}, out = [];
  list.forEach(function (r) { var k = [r.artist, r.title, r.label, r.year, r.media.join('+')].join('|').toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(r); } });
  return out.slice(0, 8);
}
async function findByCode(code) {
  var q = 'barcode:' + code;
  if (code.length === 13 && code.charAt(0) === '0') q += ' OR barcode:' + code.slice(1);
  else if (code.length === 12) q += ' OR barcode:0' + code;
  var j = await mbGet('/release/?query=' + encodeURIComponent(q) + '&fmt=json&limit=15');
  return dedupRel((j.releases || []).map(normRel));
}
async function findByName(artist, title) {
  var lq = function (s) { return '"' + s.replace(/["\\]/g, ' ').trim() + '"'; }, parts = [];
  if (artist) parts.push('artist:' + lq(artist));
  if (title) parts.push('release:' + lq(title));
  var j = await mbGet('/release/?query=' + encodeURIComponent(parts.join(' AND ')) + '&fmt=json&limit=25');
  return dedupRel((j.releases || []).map(normRel));
}
async function genreOf(rg) {
  if (!rg) return '';
  try {
    var j = await mbGet('/release-group/' + encodeURIComponent(rg) + '?inc=genres&fmt=json');
    var g = (j.genres || []).slice().sort(function (a, b) { return (b.count || 0) - (a.count || 0); })[0];
    return g && g.name ? g.name.charAt(0).toUpperCase() + g.name.slice(1) : '';
  } catch (e) { return ''; }
}
// porta un'immagine a 320x320 JPEG, come fa l'app sul PC
function imgToCover(src, cors) {
  return new Promise(function (res) {
    var im = new Image(), t = setTimeout(function () { res(''); }, 15000);
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = function () {
      clearTimeout(t);
      try {
        var size = 320, c = document.createElement('canvas'); c.width = size; c.height = size;
        var x = c.getContext('2d'), sc = Math.max(size / im.width, size / im.height), w = im.width * sc, h = im.height * sc;
        x.drawImage(im, (size - w) / 2, (size - h) / 2, w, h);
        res(c.toDataURL('image/jpeg', 0.85));
      } catch (e) { res(''); }
    };
    im.onerror = function () { clearTimeout(t); res(''); };
    im.src = src;
  });
}
async function coverOf(rel) {
  var c = await imgToCover(CAAB + '/release/' + encodeURIComponent(rel.id) + '/front-500', true);
  if (!c && rel.rg) c = await imgToCover(CAAB + '/release-group/' + encodeURIComponent(rel.rg) + '/front-500', true);
  return c;
}

// ---------- fotocamera e lettura del codice ----------
var SC = { stream: null, timer: 0, det: null, rd: null, tok: 0, cv: null, zx: null };
function loadZX() {
  if (window.ZXing) return Promise.resolve();
  if (SC.zx) return SC.zx;
  SC.zx = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = ZXURL; s.async = true;
    s.onload = function () { window.ZXing ? res() : rej(new Error('zx')); };
    s.onerror = function () { SC.zx = null; rej(new Error('zx')); };
    document.head.appendChild(s);
  });
  return SC.zx;
}
function camStop() {
  SC.tok++; clearTimeout(SC.timer);
  if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
  var v = $('camv'); if (v) { try { v.srcObject = null; } catch (e) {} }
}
function zxDecode(v) {
  var c = SC.cv || (SC.cv = document.createElement('canvas')), w = v.videoWidth, h = v.videoHeight, s = Math.min(1, 960 / w);
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d', { willReadFrequently: true }).drawImage(v, 0, 0, c.width, c.height);
  if (!SC.rd) {
    var hs = new Map(), F = ZXing.BarcodeFormat;
    hs.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.UPC_A, F.EAN_8, F.UPC_E]);
    hs.set(ZXing.DecodeHintType.TRY_HARDER, true);

  try { return SC.rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); }

}
async function camBegin() {
  var tok = ++SC.tok, v = $('camv'); if (!v) return;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    var st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    if (tok !== SC.tok) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
    SC.stream = st; v.srcObject = st; v.muted = true; v.setAttribute('playsinline', '');
    try { await v.play(); } catch (e) {}
    SC.det = null;
    if ('BarcodeDetector' in window) {
      try {
        var fm = await BarcodeDetector.getSupportedFormats();
        var want = ['ean_13', 'upc_a', 'ean_8', 'upc_e'].filter(function (f) { return fm.indexOf(f) > -1; });
        if (want.indexOf('ean_13') > -1) SC.det = new BarcodeDetector({ formats: want });
      } catch (e) {}
    }
    if (!SC.det) await loadZX();
    if (tok !== SC.tok) return;
    if (A && !A.msg) setAMsg('Inquadra il codice a barre del disco.', '');
    camTick(tok);
  } catch (e) {
    if (tok !== SC.tok) return;
    camStop();
    var box = $('cam'); if (box) box.hidden = true;
    if (A && !A.msg) setAMsg(e && e.name === 'NotAllowedError' ? 'Accesso alla fotocamera negato: scrivi il codice qui sotto.' : 'Lo scanner non è disponibile qui: scrivi il codice qui sotto.', 'bad');

async function camTick(tok) {

  if (code && A && code !== A.lastCode && /^\d{8,14}$/.test(code)) { try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} runSearch('code', code); return; }
  SC.timer = setTimeout(function () { camTick(tok); }, SC.det ? 120 : 220);
}

// ---------- schermata "Aggiungi un disco" ----------
var A = null;
function setAMsg(t, c) { if (A) { A.msg = t; A.msgc = c || ''; } var m = $('amsg'); if (m) { m.className = 'msg ' + (c || ''); m.textContent = t || ''; } }

function openAdd() {
  A = { step: '', msg: '', msgc: '', results: [], sel: null, cover: '', coverState: '', genre: '', media: ['cd'], owner: '', forceOk: false, busy: false, lastCode: '' };
  $('add').hidden = false; document.body.style.overflow = 'hidden';
  goStart('', '');
}
function closeAdd() {
  camStop(); A = null; $('add').hidden = true;
  if ($('sheet').hidden) document.body.style.overflow = '';
}
function goStart(msg, cls) {
  camStop(); if (!A) return;
  A.step = 'start'; A.msg = msg || ''; A.msgc = cls || '';
  $('addp').innerHTML = aHead('Aggiungi un disco') +
    '<div class="cam" id="cam"><video id="camv" playsinline muted></video><div class="aim"></div></div>' +
    '<div class="msg ' + esc(A.msgc) + '" id="amsg" role="status">' + esc(A.msg) + '</div>' +
    '<form id="aform-code" class="wform" autocomplete="off"><label class="alab" for="a-code">Oppure scrivi il codice a barre</label><input id="a-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="Per esempio 602547924870"><div class="row"><button class="btn primary" type="submit">Cerca il codice</button></div></form>' +
    '<div class="asep">oppure</div>' +
    '<form id="aform-name" class="wform" autocomplete="off"><label class="alab" for="a-art">Cerca per nome</label><input id="a-art" type="text" maxlength="120" placeholder="Artista" autocapitalize="words" spellcheck="false"><input id="a-tit" type="text" maxlength="160" placeholder="Titolo del disco" autocapitalize="words" spellcheck="false"><div class="row"><button class="btn" type="submit">Cerca</button></div></form>';
  $('addp').scrollTop = 0;

}
async function runSearch(kind, a, b) {
  if (!A) return;
  camStop(); A.step = 'busy'; if (kind === 'code') A.lastCode = a;
  $('addp').innerHTML = aHead('Aggiungi un disco') + '<div class="aload"><div class="dots"></div><div>Cerco su MusicBrainz…</div></div>';
  var list;
  try { list = kind === 'code' ? await findByCode(a) : await findByName(a, b); }

  if (!list.length) { goStart(kind === 'code' ? 'Nessun disco con il codice ' + a + ' su MusicBrainz. Prova a cercarlo per nome.' : 'Nessun risultato: controlla artista e titolo.', 'bad'); return; }

  var fmt = function (m) { return m === 'vinile' ? 'Vinile' : (m === 'dvd' ? 'DVD' : 'CD'); };
  $('addp').innerHTML = aHead(list.length === 1 ? 'Ho trovato questo disco' : 'Scegli il disco') +
    '<div class="alist">' + list.map(function (r, i) {
      return '<button type="button" class="res" data-a="pick" data-i="' + i + '"><span class="th"><img alt="" loading="lazy" src="' + esc(CAAB + '/release/' + r.id + '/front-250') + '" onerror="this.style.visibility=\'hidden\'"></span><span class="ht"><b>' + esc(r.title || '—') + '</b><span>' + esc(r.artist || 'Sconosciuto') + '</span><span>' + esc([r.label, r.year, r.media.map(fmt).join(' + '), r.country].filter(Boolean).join(' · ')) + '</span></span></button>';
    }).join('') + '</div><div class="row"><button class="btn" type="button" data-a="back">Indietro</button></div>';
  $('addp').scrollTop = 0;
}
function pickRel(i) {
  var r = A && A.results[i]; if (!r) return;
  A.sel = r; A.step = 'confirm'; A.cover = ''; A.coverState = 'load'; A.genre = ''; A.media = r.media.slice(); A.forceOk = false; A.busy = false;
  A.owner = (V.owner !== 'all' && D.members.some(function (m) { return m.id === V.owner; })) ? V.owner : (D.members[0] ? D.members[0].id : '');
  renderConfirm('');
  var mine = r;
  coverOf(r).then(function (c) { if (A && A.sel === mine) { A.cover = c; A.coverState = c ? 'ok' : 'none'; paintCover(); } });
  genreOf(r.rg).then(function (g) { if (A && A.sel === mine && g) { A.genre = g; var gi = $('a-genre'); if (gi && !gi.value) gi.value = g; } });

function paintCover() {

}
function renderConfirm(msg) {

  $('addp').innerHTML = aHead('Controlla e aggiungi') +
    '<div class="dh"><div class="acov" id="acov"></div><div><div class="by">' + esc(r.artist || 'Sconosciuto') + '</div><h2>' + esc(r.title || '—') + '</h2><div class="tags">' + (r.year ? '<span class="tag">' + esc(r.year) + '</span>' : '') + '</div><div class="row"><button class="link" type="button" data-a="photo">Scegli un\'altra copertina</button></div></div></div>' +
    '<form id="aform-save" class="wform afields" autocomplete="off">' +
    '<label class="alab" for="a-artist">Artista</label><input id="a-artist" type="text" maxlength="120" value="' + esc(r.artist) + '">' +
    '<label class="alab" for="a-title">Titolo</label><input id="a-title" type="text" maxlength="160" value="' + esc(r.title) + '">' +
    '<label class="alab" for="a-label">Etichetta</label><input id="a-label" type="text" maxlength="120" value="' + esc(r.label) + '">' +

    (D.members.length ? '<label class="alab" for="a-owner">Nella collezione di</label><select id="a-owner">' + D.members.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === A.owner ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select>' : '') +

async function saveNew() {
  if (!A || A.busy) return;
  var artist = $('a-artist').value.trim(), title = $('a-title').value.trim();
  if (!artist || !title) { setAMsg('Scrivi sia l\'artista sia il titolo.', 'bad'); return; }
  var owner = $('a-owner') ? $('a-owner').value : '';
  var na = normW(artist), nt = normW(title);
  var dup = D.discs.filter(function (x) { return normW(x.artist) === na && normW(x.title) === nt; })[0];
  if (dup && !A.forceOk) {
    A.forceOk = true; $('a-go').textContent = 'Aggiungi comunque';
    setAMsg('Hai già questo disco nel catalogo. Premi "Aggiungi comunque" se è un\'altra copia.', 'bad'); return;
  }
  A.busy = true; $('a-go').disabled = true; setAMsg('Salvo…', '');
  var now = Date.now();
  var rec = { id: 'c' + now.toString(36) + Math.floor(Math.random() * 1e4).toString(36), artist: artist, title: title, genre: $('a-genre').value.trim(), media: A.media.length ? A.media : ['cd'], owner: owner || undefined, label: $('a-label').value.trim(), note: '', cover: A.cover || '', rating: 0 };
  if (!rec.owner) delete rec.owner;
  try {
    var fields = toFields(rec); fields.u = { integerValue: String(now) }; fields.h = { stringValue: await sha1hex(stable(rec)) };
    await fs('PATCH', '/discs/' + encodeURIComponent(rec.id) + '?currentDocument.exists=false', { fields: fields });
  } catch (e) {
    if (!A) return; A.busy = false;
    if (e.code === 'relogin') { closeAdd(); toLogin(ERR.relogin); return; }
    var g = $('a-go'); if (g) g.disabled = false;
    setAMsg(e.status === 409 || e.status === 412 ? ERR.exists : (ERR[e.code] || ERR.api_error), 'bad'); return;
  }
  var ent = { id: rec.id, u: now, rec: rec };
  D.cache[rec.id] = ent; await idbOpen(); await idbWrite([ent], []); rebuild(); renderAll();
  setStatus(D.discs.length + ' dischi · aggiunto ora');
  if (!A) return;
  A.step = 'done';
  $('addp').innerHTML = aHead('Fatto') + '<div class="dh"><div class="acov">' + (rec.cover ? '<img alt="" src="' + esc(rec.cover) + '">' : 'Nessuna copertina') + '</div><div><div class="by">' + esc(rec.artist) + '</div><h2>' + esc(rec.title) + '</h2></div></div>' +
    '<p class="hint" id="adone">Aggiunto al catalogo. Sul PC arriva alla prossima sincronizzazione' + (rec.cover ? '' : '; la copertina puoi aggiungerla da lì') + '. L\'Overview la generi dal PC.</p>' +
    '<div class="row"><button class="btn primary" type="button" data-a="again">Scansiona un altro</button><button class="btn" type="button" data-a="close">Chiudi</button></div>';
}

$('addbtn').addEventListener('click', openAdd);
$('add').addEventListener('click', function (ev) {
  var t = ev.target;
  if (t === $('add')) return closeAdd();
  var b = t.closest('[data-a]'); if (!b || !A) return;
  var a = b.dataset.a;
  if (a === 'close') closeAdd();
  else if (a === 'back') goStart('', '');
  else if (a === 'again') { A.lastCode = ''; goStart('', ''); }
  else if (a === 'pick') pickRel(Number(b.dataset.i));
  else if (a === 'photo') $('a-file').click();
  else if (a === 'sup') {
    var s = b.dataset.s, i = A.media.indexOf(s);
    if (i > -1) { if (A.media.length > 1) A.media.splice(i, 1); } else A.media.push(s);
    document.querySelectorAll('#a-sup .chip').forEach(function (c) { c.classList.toggle('on', A.media.indexOf(c.dataset.s) > -1); });
  }
});
$('add').addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (!A) return;
  if (ev.target.id === 'aform-code') {
    var c = ($('a-code').value || '').replace(/\D/g, '');
    if (c.length < 8) return setAMsg('Il codice a barre ha almeno 8 cifre.', 'bad');
    runSearch('code', c);
  } else if (ev.target.id === 'aform-name') {
    var ar = $('a-art').value.trim(), ti = $('a-tit').value.trim();
    if (!ar && !ti) return setAMsg('Scrivi almeno l\'artista o il titolo.', 'bad');
    runSearch('name', ar, ti);
  } else if (ev.target.id === 'aform-save') saveNew();
});
$('a-file').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = '';
  if (!f || !A || A.step !== 'confirm') return;
  if (f.size > 12 * 1024 * 1024) { setAMsg('Immagine troppo grande (massimo 12 MB).', 'bad'); return; }
  var url = URL.createObjectURL(f), mine = A.sel; A.coverState = 'load'; paintCover();
  imgToCover(url, false).then(function (c) {
    URL.revokeObjectURL(url);
    if (A && A.sel === mine) { if (c) A.cover = c; A.coverState = A.cover ? 'ok' : 'none'; paintCover(); }
  });
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('add').hidden) closeAdd(); });

// ---------- installazione come app (Chrome per Android) ----------
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} });
}

// ---------- avvio ----------
(async function init() {
  if (lsGet('plume.rt')) {
    $('app').hidden = false;
    try { await token(); await loadAll(); }
    catch (e) { if (e.code === 'relogin' || e.code === 'bad_credentials') toLogin(''); else { $('bootmsg').textContent = ERR[e.code] || ERR.api_error; $('boot').querySelector('.dots').hidden = true; } }
  } else toLogin('');
})();
</script>
